<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingWatch | Kurumsal İzleme Sistemi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
            overflow-x: hidden;
        }

        /* --- LOADING EKRANI --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a252f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10001;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-logo {
            max-width: 200px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(0.9);
                opacity: 0.8;
            }
        }

        /* --- LOGIN PANELİ (DÜZELTİLDİ) --- */
        #login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f4f7f6;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }

            .login-box img {
                width: 150px;
                margin-bottom: 20px;
            }

            /* Login kutusundaki TÜM inputlar için ortak ve eşit stil */
            .login-box input {
                width: 100%;
                padding: 12px 15px;
                margin: 10px 0;
                border: 1px solid #ddd;
                border-radius: 6px;
                box-sizing: border-box; /* Padding'i boyuta dahil et */
                outline: none;
                transition: 0.3s;
                font-size: 14px;
                height: 45px; /* Yüksekliği sabitle */
            }

                .login-box input:focus {
                    border-color: #3498db;
                }

            .login-box button {
                width: 100%;
                padding: 12px;
                background: #1a252f;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                margin-top: 10px;
                transition: 0.3s;
            }

                .login-box button:hover {
                    background: #2c3e50;
                }

        #login-error {
            color: #e74c3c;
            display: none;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* --- ANA UYGULAMA --- */
        #main-app {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        /* --- NAVBAR --- */
        .navbar {
            background-color: #1a252f;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .navbar-brand {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            letter-spacing: 1px;
        }

        .nav-logo {
            height: 55px;
            border-radius: 4px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-link {
            color: #bdc3c7;
            text-decoration: none;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
            font-weight: 500;
        }

            .nav-link.active {
                background-color: #3498db;
                color: white;
            }

            .nav-link:hover:not(.disabled) {
                background-color: #2c3e50;
                color: white;
            }

            .nav-link.disabled {
                color: #7f8c8d;
                cursor: not-allowed;
                opacity: 0.5;
                pointer-events: none;
            }

        .user-badge {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
            border: 1px solid #34495e;
        }

        .logout-btn {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 7px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

            .logout-btn:hover {
                background-color: #e74c3c;
                color: white;
            }

        /* --- HERO & STATS --- */
        .hero {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

            .hero h1 {
                margin: 0 0 10px 0;
                font-size: 24px;
                letter-spacing: 1px;
            }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
        }

        .stat-total {
            color: #ecf0f1;
        }

        .stat-active {
            color: #2ecc71;
        }

        .stat-passive {
            color: #e74c3c;
        }

        .last-update {
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 5px;
        }

        /* --- MAIN CONTENT & KONTROLLER (DÜZELTİLDİ) --- */
        .main-content {
            flex: 1;
            padding: 25px 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .add-group, .search-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Dashboard'daki inputlar için ÖZEL kural (Login'i etkilemez) */
        .controls input[type="text"] {
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 180px;
            outline: none;
            transition: border-color 0.3s;
        }

            .controls input[type="text"]:focus {
                border-color: #3498db;
            }

        .add-btn {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

            .add-btn:hover {
                background-color: #2980b9;
            }

        /* --- KARTLAR --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }

            .card:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            }

            .card.up {
                border-top: 4px solid #2ecc71;
            }

            .card.down {
                border-top: 4px solid #e74c3c;
            }

        .device-name {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0 2px 0;
            word-break: break-word;
        }

        .ip-address {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .status {
            font-size: 11px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 15px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

            .status.up {
                background-color: #e8f8f5;
                color: #2ecc71;
            }

            .status.down {
                background-color: #fdedec;
                color: #e74c3c;
            }

        .delete-btn {
            background-color: transparent;
            color: #95a5a6;
            border: 1px solid #bdc3c7;
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .card:hover .delete-btn {
            opacity: 1;
            visibility: visible;
        }

        .delete-btn:hover {
            background-color: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
            font-size: 14px;
            width: 100%;
        }

            footer a {
                color: #3498db;
                text-decoration: none;
                font-weight: bold;
            }

                footer a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div id="loading-screen">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/%C5%9Ei%C5%9Fecam.png" alt="Yükleniyor" class="loading-logo">
    </div>

    <div id="login-container">
        <div class="login-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/%C5%9Ei%C5%9Fecam.png" alt="Logo">
            <h2>PingWatch Giriş</h2>
            <div id="login-error">Hatalı kullanıcı adı veya şifre!</div>
            <input type="text" id="username" placeholder="Kullanıcı Adı" autocomplete="off">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="handleLogin()">Giriş Yap</button>
        </div>
    </div>

    <div id="main-app">
        <nav class="navbar">
            <a href="#" class="navbar-brand">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/%C5%9Ei%C5%9Fecam.png" alt="Logo" class="nav-logo">
                PingWatch
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link active">Anasayfa</a>
                <a href="#" class="nav-link disabled">Dashboard (İzleme)</a>
                <a href="#" class="nav-link disabled" id="nav-admin-link">🔒 Yönetim Paneli</a>
                <span class="user-badge" id="nav-user-info">Kullanıcı</span>
                <button class="logout-btn" onclick="handleLogout()">Çıkış</button>
            </div>
        </nav>

        <div class="hero">
            <h1>Ağ İzleme Paneli</h1>
            <div class="stats-container">
                <div class="stat-box stat-total">Toplam: <span id="countTotal">0</span></div>
                <div class="stat-box stat-active">Aktif: <span id="countActive">0</span></div>
                <div class="stat-box stat-passive">Down: <span id="countPassive">0</span></div>
            </div>
            <div class="last-update" id="lastUpdateText"></div>
        </div>

        <div class="main-content">
            <div class="controls">
                <div class="add-group" id="admin-add-form">
                    <input type="text" id="nameInput" placeholder="Cihaz Adı (Örn: Ana Router)" />
                    <input type="text" id="ipInput" placeholder="IP Adresi (Örn: 192.168.1.1)" />
                    <button class="add-btn" onclick="addIp()">Cihaz Ekle</button>
                </div>
                <div class="search-group">
                    <input type="text" id="searchInput" placeholder="Cihaz Adı veya IP Ara..." onkeyup="renderCards()" />
                </div>
            </div>
            <div class="dashboard" id="ipCards"></div>
        </div>

        <footer>
            <p>Geliştiren: <a href="https://github.com/ardaa24" target="_blank">ardaa24</a> | PingWatch © 2026</p>
        </footer>
    </div>

    <script>
        const baseUrl = "/api/Ip";
        let allData = [];
        let pollingInterval = null;

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1500);

            if (localStorage.getItem("isLoggedIn") === "true") {
                showApp();
            }
        });

        async function handleLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const errorMsg = document.getElementById("login-error");

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("isLoggedIn", "true");
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("role", data.role);
                    showApp();
                } else {
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                alert("Sunucuya bağlanılamadı!");
            }
        }

        function handleLogout() {
            localStorage.clear();
            location.reload();
        }

        function showApp() {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("main-app").style.display = "flex";

            const username = localStorage.getItem("username");
            const role = localStorage.getItem("role");

            const capitalizedUser = username.charAt(0).toUpperCase() + username.slice(1);
            document.getElementById("nav-user-info").innerText = `${capitalizedUser} (${role})`;

            if (role !== "Admin") {
                document.getElementById("admin-add-form").style.display = "none";
                document.getElementById("nav-admin-link").style.display = "none";
            }

            loadIps();
            if (!pollingInterval) {
                pollingInterval = setInterval(loadIps, 30000);
            }
        }

        async function loadIps() {
            try {
                const response = await fetch(baseUrl, { cache: "no-store" });
                allData = await response.json();
                renderCards();
            } catch (error) { console.error(error); }
        }

        function renderCards() {
            const container = document.getElementById("ipCards");
            container.innerHTML = "";

            const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
            const role = localStorage.getItem("role");
            const isAdmin = role === "Admin";

            let filteredData = allData.filter(ip =>
                ip.address.toLowerCase().includes(searchTerm) ||
                (ip.name && ip.name.toLowerCase().includes(searchTerm))
            );

            filteredData.sort((a, b) => (a.isUp === b.isUp) ? 0 : a.isUp ? 1 : -1);

            document.getElementById("countTotal").innerText = allData.length;
            document.getElementById("countActive").innerText = allData.filter(ip => ip.isUp).length;
            document.getElementById("countPassive").innerText = allData.filter(ip => !ip.isUp).length;

            const now = new Date();
            document.getElementById("lastUpdateText").innerText = "Son Güncelleme: " + now.toLocaleTimeString('tr-TR');

            filteredData.forEach(ip => {
                const isUp = ip.isUp;
                const cardClass = isUp ? "up" : "down";
                const statusText = isUp ? "ONLINE" : "OFFLINE";
                const deviceName = ip.name || "İsimsiz Cihaz";

                const deleteButtonHtml = isAdmin
                    ? `<button class="delete-btn" onclick="deleteIp(${ip.id})">Sil</button>`
                    : '';

                container.innerHTML += `
                        <div class="card ${cardClass}">
                            <div class="status ${cardClass}">${statusText}</div>
                            <div class="device-name">${deviceName}</div>
                            <div class="ip-address">${ip.address}</div>
                            ${deleteButtonHtml}
                        </div>
                    `;
            });
        }

        async function addIp() {
            if (localStorage.getItem("role") !== "Admin") return alert("Yetkiniz yok!");

            const nameInput = document.getElementById("nameInput");
            const ipInput = document.getElementById("ipInput");
            if (!ipInput.value.trim()) return alert("Lütfen bir IP adresi girin!");

            const btn = document.querySelector('.add-btn');
            btn.disabled = true; btn.innerText = "Ekleniyor...";

            try {
                await fetch(baseUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: nameInput.value.trim(), address: ipInput.value.trim(), isUp: false, isActive: true })
                });
                nameInput.value = ""; ipInput.value = "";
                loadIps();
            } finally {
                btn.disabled = false; btn.innerText = "Cihaz Ekle";
            }
        }

        async function deleteIp(id) {
            if (localStorage.getItem("role") !== "Admin") return alert("Yetkiniz yok!");

            try {
                await fetch(baseUrl + "/" + id, { method: "DELETE" });
                loadIps();
            } catch (error) { console.error(error); }
        }
    </script>
</body>
</html>
